# Photoneo PhoXi 3D structured-light scanner (src/binpick/camera_phoxi.py — PhoXiCamera)
_target_: src.binpick.camera_phoxi.PhoXiCamera

# device_id: null -> auto-select the first discovered PhoXi3DScan device.
# Set explicitly (see PhoXiControl's device list) if more than one scanner is present.
device_id: null

# address: only needed for a direct connection if network discovery doesn't find the
# scanner (PhoXi Control -> Tools -> Add Device via Address).
address: null

# Extrinsic calibration: 4×4 transform from camera frame to robot-base frame.
# This scanner is rigidly mounted in the workspace (NOT on the arm), so unlike
# arm.T_cam_ee this is used directly — there is no per-capture FK recompute.
# Generate with:  python scripts/calibrate_T_cam_base_phoxi.py
T_cam_base:
  - [-0.03823340, -0.99926283, -0.00346369, 0.28595885]
  - [-0.97867277, 0.03674502, 0.20211236, -0.28943317]
  - [-0.20183609, 0.01111726, -0.97935622, 0.70415632]
  - [0.00000000, 0.00000000, 0.00000000, 1.00000000]