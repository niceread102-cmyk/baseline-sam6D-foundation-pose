# Photoneo PhoXi 3D structured-light scanner (src/binpick/camera_phoxi.py — PhoXiCamera)
_target_: src.binpick.camera_phoxi.PhoXiCamera

# device_id: null -> auto-select the first discovered PhoXi3DScan device.
# Set explicitly (see PhoXiControl's device list) if more than one scanner is present.
